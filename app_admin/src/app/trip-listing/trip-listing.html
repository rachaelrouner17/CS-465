<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="mb-1">Trip listings</h1>
    <p class="text-muted mb-0">Manage trips stored by the Travlr API.</p>
  </div>
</div>

<div *ngIf="loading" class="alert alert-info">Loading trips...</div>
<div *ngIf="error" class="alert alert-warning">{{ error }}</div>

<div class="row g-4">
  <div class="col-12 col-md-6 col-lg-4" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip"></app-trip-card>
  </div>
</div>
